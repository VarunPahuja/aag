[alembic]
# Relative to this file's own directory (backend/), regardless of the
# process's current working directory — `make db-reset` invokes this as
# `alembic -c backend/alembic.ini upgrade head` from the repo root.
script_location = %(here)s/alembic

# sqlalchemy.url is deliberately absent here: backend/alembic/env.py reads
# DATABASE_URL from the environment (see .env.example), falling back to the
# same default docker-compose.yml uses, so one connection string is never
# duplicated between this file and the app's own config.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
