[project]
name = "governance"
version = "0.1.0"
description = "Agentic Governance — LLM agents that reason over trust evidence and recommend autonomy changes"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["governance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100
target-version = "py311"
