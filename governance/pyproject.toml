[project]
name = "governance"
version = "0.1.0"
description = "Agentic Governance — LLM agents that reason over trust evidence and recommend autonomy changes"
requires-python = ">=3.11"
# pydantic validates every LLM response before it reaches the coordinator
# (governance/prompts/schema.py). httpx is the Gemini client's transport
# (governance/llm/gemini.py) and its MockTransport is what lets the client be tested
# without a network. langgraph already pulls both in, but this lane depends on them
# directly and says so rather than relying on someone else's transitive pin.
dependencies = ["langgraph>=1.0", "pydantic>=2.0", "httpx>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["governance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100
target-version = "py311"
