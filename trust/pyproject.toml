[project]
name = "trust"
version = "0.1.0"
description = "Trust & Risk Intelligence — pure statistical evidence for earned autonomy"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "statsmodels>=0.14",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trust_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.report]
fail_under = 95